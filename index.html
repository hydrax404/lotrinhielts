            const doneCount = sessions.filter(s => s.done).length;
            const feeCount = sessions.filter(s => s.fee).length;
            const percent = Math.round((doneCount / sessions.length) * 100);

            document.getElementById('stat-progress').innerText = `${doneCount}/32 Buổi (${percent}%)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('stat-fee').innerText = `${feeCount}/32 Buổi`;

            const nextSession = sessions.find(s => !s.done);
            if (nextSession) {
                document.getElementById('stat-next').innerText = nextSession.buoi;
                document.getElementById('stat-next-desc').innerText = nextSession.content.split('\n')[0];
                document.getElementById('stat-phase').innerText = nextSession.phase.split(':')[0] + ': ' + nextSession.phase.split(':')[1];
            } else {
                document.getElementById('stat-next').innerText = "Hoàn thành khóa học!";
                document.getElementById('stat-next-desc').innerText = "Sẵn sàng đi thi";
            }
        }

        function setPhaseFilter(phase) {
            currentPhase = phase;
            document.querySelectorAll('.phase-tab').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(phase === 'ALL' ? 'Tất cả' : phase));
            });
            renderSessions();
        }

        function setSkillFilter(skill) {
            currentSkill = skill;
            document.getElementById('skill-ALL').className = skill === 'ALL' ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-white' : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600';
            document.getElementById('skill-RL').className = skill === 'READ + LIS' ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white' : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-50 text-blue-700';
            document.getElementById('skill-WS').className = skill === 'WRITE + SPEAK' ? 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-pink-600 text-white' : 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-pink-50 text-pink-700';
            renderSessions();
        }

        function toggleDone(id) {
            const s = sessions.find(item => item.id === id);
            if (s) { s.done = !s.done; saveData(); renderSessions(); }
        }

        function toggleFee(id) {
            const s = sessions.find(item => item.id === id);
            if (s) { s.fee = !s.fee; saveData(); renderSessions(); }
        }

        function updateNote(id, value) {
            const s = sessions.find(item => item.id === id);
            if (s) { s.note = value; saveData(); }
        }

        function toggleStudentMode() {
            studentMode = !studentMode;
            const btn = document.getElementById('modeBtn');
            btn.innerHTML = studentMode ? '<i class="fa-solid fa-user-graduate"></i> <span>Chế độ Học sinh</span>' : '<i class="fa-solid fa-eye"></i> <span>Chế độ Giáo viên</span>';
            document.querySelectorAll('.fee-column').forEach(el => {
                el.style.display = studentMode ? 'none' : '';
            });
        }

        function renderSessions() {
            const container = document.getElementById('sessions-container');
            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = sessions.filter(s => {
                const matchPhase = currentPhase === 'ALL' || s.phase === currentPhase;
                const matchSkill = currentSkill === 'ALL' || s.skill === currentSkill;
                const matchQuery = s.buoi.toLowerCase().includes(query) || s.content.toLowerCase().includes(query) || s.btvn.toLowerCase().includes(query) || s.note.toLowerCase().includes(query);
                return matchPhase && matchSkill && matchQuery;
            });

            container.innerHTML = filtered.map(s => `
                <div class="bg-white rounded-2xl border ${s.done ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200'} p-5 shadow-sm transition hover:shadow-md">
                    <div class="flex flex-wrap justify-between items-center gap-3 pb-3 mb-3 border-b border-slate-100">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleDone(${s.id})" class="w-5 h-5 accent-emerald-600 rounded cursor-pointer" title="Đánh dấu hoàn thành buổi học">
                            <span class="font-bold text-base ${s.done ? 'line-through text-slate-400' : 'text-slate-900'}">${s.buoi}</span>
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${s.skill === 'READ + LIS' ? 'skill-badge-rl' : 'skill-badge-ws'}">${s.skill}</span>
                            <span class="text-xs text-slate-400 font-medium hidden sm:inline">• ${s.phase}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <label class="fee-column flex items-center gap-1.5 text-xs font-medium cursor-pointer ${s.fee ? 'text-emerald-700 bg-emerald-100' : 'text-slate-500 bg-slate-100'} px-3 py-1 rounded-lg" style="${studentMode ? 'display:none' : ''}">
                                <input type="checkbox" ${s.fee ? 'checked' : ''} onchange="toggleFee(${s.id})" class="accent-emerald-600">
                                <span>Học phí</span>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                            <p class="text-xs font-bold uppercase text-slate-400 mb-1.5"><i class="fa-solid fa-book-open mr-1"></i> Nội dung bài học</p>
                            <div class="text-sm text-slate-700 whitespace-pre-line leading-relaxed">${s.content}</div>
                        </div>

                        <div class="bg-amber-50/60 p-3.5 rounded-xl border border-amber-100">
                            <p class="text-xs font-bold uppercase text-amber-700 mb-1.5"><i class="fa-solid fa-list-check mr-1"></i> Bài tập về nhà (BTVN)</p>
                            <div class="text-sm text-slate-700 whitespace-pre-line leading-relaxed">${s.btvn}</div>
                        </div>

                        <div class="bg-indigo-50/40 p-3.5 rounded-xl border border-indigo-100 flex flex-col">
                            <p class="text-xs font-bold uppercase text-indigo-700 mb-1.5"><i class="fa-solid fa-comment-dots mr-1"></i> Nhận xét của Giáo viên</p>
                            <textarea oninput="updateNote(${s.id}, this.value)" placeholder="Nhập nhận xét buổi học tại đây..." class="w-full flex-1 bg-white border border-slate-200 rounded-lg p-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none">${s.note}</textarea>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function exportCSV() {
            let csv = "Buổi,Giai đoạn,Kỹ năng,Nội dung,BTVN,Tiến độ,Nhận xét,Học phí\n";
            sessions.forEach(s => {
                const clean = str => `"${(str || '').replace(/"/g, '""')}"`;
                csv += `${clean(s.buoi)},${clean(s.phase)},${clean(s.skill)},${clean(s.content)},${clean(s.btvn)},${s.done},${clean(s.note)},${s.fee}\n`;
            });
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Lo_Trinh_IELTS_Cap_Nhat.csv";
            link.click();
        }

        function resetData() {
            if (confirm("Khôi phục lại dữ liệu ban đầu từ Google Sheet?")) {
                localStorage.removeItem('ielts_roadmap_data');
                sessions = JSON.parse(JSON.stringify(initialSessions));
                saveData();
                renderSessions();
            }
        }

        updateStats();
        renderSessions();
    </script>
</body>
</html>
